name: Main

# Vercel's Git integration deploys every push to main by itself, and its build
# applies the migrations (vercel.json), so this workflow neither deploys nor
# migrates — it is the record of whether what landed is sound. A red check here
# means main is broken *and already deployed*; the gate that actually holds is
# the identical check on the pull request, before the merge (pull-request.yml).
on:
  push:
    branches: [main]
  # Re-run the checks against the current main without pushing a commit.
  workflow_dispatch: {}

permissions:
  contents: read

# Every commit on main gets its own verdict, so a later push queues rather than
# cancelling the run that was still checking the earlier one — cancelled runs
# would leave commits on main with no result at all.
concurrency:
  group: main
  cancel-in-progress: false

env:
  # Matches the Node major Vercel builds with, so a version-specific failure
  # shows up here rather than in the deployment; bump here and in
  # pull-request.yml together.
  NODE_VERSION: '22'

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` rather than `npm install`: the checks have to run against the
      # exact tree that deploys, not against whatever resolved today.
      - name: Install dependencies
        run: npm ci

      # The checks below each run even when an earlier one failed, so one push
      # reports every problem instead of revealing them one round-trip at a
      # time. The job still fails if any of them do.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      # Catches what tsc alone cannot: a route that fails to compile under the
      # Next build, or a page that throws while being prerendered.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  # A separate job rather than more steps on `verify` — see the matching
  # comment in pull-request.yml. This suite builds and boots the app itself
  # (see playwright.config.ts's webServer) on top of installing a browser,
  # which made it the slowest part of the old single-job pipeline by a wide
  # margin, strictly after lint/typecheck/test/build had already run in
  # sequence. Splitting it out runs it in parallel with `verify` instead.
  e2e:
    name: End-to-end
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Playwright skips downloading a browser revision it finds already
      # unpacked at this path, so restoring this across runs turns "Install
      # Playwright browser" below from a multi-hundred-megabyte download into
      # a no-op — keyed on the lockfile because that pins the exact
      # @playwright/test version, and with it the browser revision it wants.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Drives the real sign-in and dashboard UI in a real browser against a
      # real (built) instance of the app — see playwright.config.ts and
      # tests-e2e/ for what the unit suite above can't reach: what the browser
      # actually shows.
      - name: End-to-end tests
        run: npm run test:e2e

      # Playwright's own HTML report and any per-test trace it kept (see
      # `trace: 'retain-on-failure'` in playwright.config.ts) are the only way
      # to see *why* a headless run failed after the runner is gone — without
      # this, a red check here means reproducing the failure locally from
      # scratch, blind.
      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
