name: CI/CD

# Nothing here is reviewed by a human before it merges, so this workflow is the
# gate: every push and pull request is typechecked, tested and built, and only a
# commit that survived all three is allowed to reach Vercel.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

# Superseding a branch's in-flight run is free — its result is already stale.
# main is exempt because its runs deploy, and a half-finished deploy is worse
# than a slow one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Matches the Node major Vercel builds with; bump both together.
  NODE_VERSION: '22'

jobs:
  verify:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # `npm ci` rather than `npm install`: the checks have to run against the
      # exact tree that deploys, not against whatever resolved today.
      - name: Install dependencies
        run: npm ci

      # The four checks below each run even when an earlier one failed, so one
      # push reports every problem instead of revealing them one round-trip at a
      # time. The job still fails if any of them do.
      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

      - name: Typecheck
        if: ${{ !cancelled() }}
        run: npm run typecheck

      - name: Test
        if: ${{ !cancelled() }}
        run: npm test

      # Catches what tsc alone cannot: a route that fails to compile under the
      # Next build, or a page that throws while being prerendered.
      - name: Build
        if: ${{ !cancelled() }}
        run: npm run build

  deploy-preview:
    name: Preview deploy
    needs: verify
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Queue rather than cancel: interrupting `vercel deploy` can leave a build
    # half-promoted, and the next push will supersede the URL anyway.
    concurrency:
      group: vercel-preview-${{ github.head_ref || github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Deploying is opt-in. Without the secrets — a fork's pull request, or a
      # repo that lets Vercel's own Git integration deploy — this reports why it
      # skipped instead of failing a pull request nobody can fix.
      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — skipping the deploy. See SETUP.md.'
          fi

      - name: Deploy preview to Vercel
        if: steps.creds.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=preview --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --token="$VERCEL_TOKEN"
          url="$(npx --yes vercel@latest deploy --prebuilt --token="$VERCEL_TOKEN")"
          echo "Preview deployment: $url" >> "$GITHUB_STEP_SUMMARY"

  # The database is the one part of a deploy that cannot be rolled back, so
  # migrations run here — after the checks, before the code that needs them, and
  # never from a pull request. A fork's branch could carry any SQL at all.
  migrate-production:
    name: Production migrations
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Two merges landing together would otherwise race for the same schema, and
    # cancelling a half-applied run is worse than making the second one wait.
    concurrency:
      group: migrate-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — skipping migrations. See SETUP.md.'
          fi

      # The connection string comes from the Vercel project, where the Neon
      # integration maintains it — never from a GitHub secret that would be a
      # second copy to keep in step. If it is not in what `pull` returned, the
      # job fails rather than guessing: an empty DATABASE_URL and a stray one
      # are both worse than a red pipeline.
      - name: Apply migrations
        if: steps.creds.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"

          env_file='.vercel/.env.production.local'
          read_var() {
            # Values arrive quoted; the string itself contains `=`, so only the
            # first one separates the name from it.
            grep -m1 "^$1=" "$env_file" | cut -d= -f2- | sed 's/^"//; s/"$//'
          }

          # The runner takes a session-scoped advisory lock, which the pooled
          # endpoint cannot hold across statements, so prefer the direct one.
          DATABASE_URL_UNPOOLED="$(read_var DATABASE_URL_UNPOOLED || true)"
          DATABASE_URL="$(read_var DATABASE_URL || true)"
          export DATABASE_URL_UNPOOLED DATABASE_URL

          if [ -z "$DATABASE_URL_UNPOOLED" ] && [ -z "$DATABASE_URL" ]; then
            echo '::error::No DATABASE_URL in the production environment pulled from Vercel. Is Neon connected to this project?'
            exit 1
          fi

          if [ -n "$DATABASE_URL_UNPOOLED" ]; then echo "::add-mask::$DATABASE_URL_UNPOOLED"; fi
          if [ -n "$DATABASE_URL" ]; then echo "::add-mask::$DATABASE_URL"; fi

          npm run migrate

  deploy-production:
    name: Production deploy
    needs: [verify, migrate-production]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: vercel-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Check for Vercel credentials
        id: creds
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          else
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::notice::VERCEL_TOKEN / VERCEL_ORG_ID / VERCEL_PROJECT_ID not set — skipping the deploy. See SETUP.md.'
          fi

      - name: Deploy to production
        id: deploy
        if: steps.creds.outputs.configured == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          set -euo pipefail
          # `pull` fetches the project's production environment variables, so
          # the build here is the same one Vercel would have produced itself.
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          url="$(npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN")"
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "Production deployment: $url" >> "$GITHUB_STEP_SUMMARY"

      # A build can succeed and still boot into a 500 — a missing environment
      # variable is the usual cause — so the pipeline only calls a deploy good
      # once the live instance has answered.
      - name: Smoke-test the deployment
        if: steps.creds.outputs.configured == 'true'
        env:
          # Prefer the stable alias when it is known: the fresh deployment URL
          # can 401 behind Vercel's deployment protection.
          APP_URL: ${{ secrets.APP_URL }}
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          target="${APP_URL:-$DEPLOY_URL}"
          echo "Checking $target/api/health"

          # Retries cover the seconds between the deploy returning and the first
          # request actually being served.
          body="$(curl --fail-with-body --silent --show-error --max-time 30 \
            --retry 5 --retry-delay 5 --retry-connrefused \
            "$target/api/health")"
          echo "$body"

          case "$body" in
            *'"ok":true'*) ;;
            *) echo "::error::/api/health did not report ok"; exit 1 ;;
          esac

          # Not fatal: the app answers, but booking cannot work until these are
          # set, and a silent pass would let that ship unnoticed.
          case "$body" in
            *'"databaseConfigured":false'*) echo '::warning::DATABASE_URL is not set on the deployment' ;;
          esac
          case "$body" in
            *'"cronConfigured":false'*) echo '::warning::CRON_SECRET is not set on the deployment' ;;
          esac
