name: Nightly instructor sync

# Refreshes who Elixia's schedule currently says is running each linked
# account's classes. Deliberately its own workflow rather than a step added
# to reindex.yml — see lib/service.ts's refreshInstructors for why this stays
# isolated from the booking and reindex logic.
on:
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch: {}

jobs:
  instructors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Refresh instructor names
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set"
            exit 1
          fi

          curl --fail-with-body --silent --show-error \
            --max-time 90 --retry 2 --retry-delay 5 \
            -X POST "$APP_URL/api/cron/instructors" \
            -H "Authorization: Bearer $CRON_SECRET"
