name: Booking watcher

# The only mechanism that drives booking. GitHub documents scheduled
# workflows as queued, not punctual — under load a trigger can arrive late
# enough that a release is missed outright, not just fired late — so this
# workflow does not rely on a schedule trigger landing anywhere near a
# release at all.
#
# Instead of being invoked once per release, one job starts well ahead of
# time and stays running: once it's up, it sleeps, using the runner's own
# accurate clock, to the exact instant before calling the tick endpoint,
# which does its own millisecond-precise sleep once inside the request (see
# lib/booking.ts) before booking. GitHub caps any single job at ~6 hours, so
# there's no way to make one job literally run forever — instead a new job
# starts every 3 hours (see the schedule below) and each one runs for up to
# ~5h50m, so by the time a job is nearing its own deadline, the next one has
# already been running for hours. That overlap is what makes the scheduler's
# own punctuality irrelevant: a trigger only has to land sometime in that
# ~2h50m margin, not on the second, for there to always be one job awake and
# watching.
on:
  schedule:
    # Only has to start a watcher sometime before the next release, so a
    # jittery trigger costs nothing. Every 3 hours leaves wide overlap against
    # the job's own budget below, so the next watcher is already running well
    # before the previous one's deadline — see the comment above.
    #
    # Minute 23, not 0: GitHub documents the top of every hour as when
    # scheduled-workflow load peaks, and a trigger there can be delayed
    # enough to be dropped outright rather than just fired late — which
    # already happened once, leaving no watcher running for hours with
    # nothing in the Actions log to show it (no queued run, no failed run,
    # just an absent one). A trigger anywhere off the hour avoids that
    # shared peak.
    - cron: '23 */3 * * *'
  workflow_dispatch: {}

# A new watcher must never race the one already running for the same release.
# GitHub queues the next scheduled trigger behind this group and starts it the
# moment the current job exits.
concurrency:
  group: booking-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    # Comfortably under GitHub's 6-hour hard ceiling for a single job — the
    # loop below stops itself well inside this so it always exits cleanly.
    timeout-minutes: 355
    steps:
      - name: Sleep to each release and fire the booking tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -uo pipefail

          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set"
            exit 1
          fi

          # Stop well inside the job's own timeout so it always exits on its
          # own terms rather than being killed mid-sleep — the next scheduled
          # trigger (or the queued one waiting on the concurrency group)
          # starts immediately after.
          budget_seconds=$((340 * 60))
          deadline=$(( $(date +%s) + budget_seconds ))

          # How long to wait before rechecking when nothing is due yet, or
          # when the next release is too far out to sleep straight through —
          # rechecking lets a nearer release (added or edited meanwhile) be
          # noticed instead of waited past.
          poll_seconds=120

          # Wake this many ms before the release: enough for the tick's own
          # handler to refresh a session and resolve the class id before its
          # precise sleep to T-0 (see lib/booking.ts), while leaving most of
          # the request's time budget for that sleep and the retry loop after.
          lead_ms=20000

          fetch_next_ms() {
            local body
            body=$(curl --fail-with-body --silent --show-error --max-time 30 \
              -H "Authorization: Bearer $CRON_SECRET" \
              "$APP_URL/api/cron/next") || return 1
            echo "$body" | jq -er '.nextReleaseEpochMs // empty'
          }

          fire_tick() {
            echo "Firing tick at $(date -u +%FT%TZ) for release at $1"
            curl --fail-with-body --silent --show-error \
              --max-time 90 --retry 2 --retry-delay 2 --retry-connrefused \
              -X POST "$APP_URL/api/cron/tick" \
              -H "Authorization: Bearer $CRON_SECRET"
            echo
          }

          while [ "$(date +%s)" -lt "$deadline" ]; do
            next_ms=$(fetch_next_ms) || {
              echo "::warning::could not reach $APP_URL/api/cron/next, retrying"
              sleep "$poll_seconds"
              continue
            }

            if [ -z "$next_ms" ]; then
              sleep "$poll_seconds"
              continue
            fi

            now_ms=$(( $(date +%s) * 1000 ))
            wait_ms=$(( next_ms - now_ms - lead_ms ))

            if [ "$wait_ms" -gt $((poll_seconds * 1000)) ]; then
              sleep "$poll_seconds"
              continue
            fi

            if [ "$wait_ms" -gt 0 ]; then
              sleep "$(awk "BEGIN { printf \"%.3f\", $wait_ms / 1000 }")"
            fi

            fire_tick "$next_ms" || echo "::warning::tick request failed, will be retried on lease expiry"
          done
