name: Booking watchdog

# A cheap safety net for the booking watcher (watch.yml). GitHub can drop a
# scheduled trigger outright under load rather than just delay it — see
# watch.yml's own header for the incident that proved it, where the watcher
# went silent for 9+ hours with nothing to show for it: no failed run, no
# queued run, just an absent one. Nothing about that failure mode leaves a
# trace for the watcher to notice on its own.
#
# This runs far more often and far more cheaply than the watcher itself
# (seconds, not hours), checks whether a watcher run is currently active, and
# re-dispatches one when it isn't. That bounds how long a dropped trigger can
# go unnoticed to about this workflow's own interval, rather than up to the
# watcher's full 3-hour cadence.
on:
  schedule:
    # Hourly, and off the watcher's own :23 so the same burst of scheduler
    # load can't plausibly drop both in the same pass.
    - cron: '53 * * * *'
  workflow_dispatch: {}

permissions:
  actions: write

jobs:
  watchdog:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Re-dispatch the watcher if none is active
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          active=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow=watch.yml \
            --json status --jq '[.[] | select(.status == "in_progress" or .status == "queued")] | length')

          if [ "$active" -eq 0 ]; then
            echo "No booking watcher running or queued — dispatching one."
            gh workflow run watch.yml --repo "$GITHUB_REPOSITORY"
          else
            echo "Booking watcher already active ($active run(s)), nothing to do."
          fi
