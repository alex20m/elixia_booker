name: Booking cron

# Vercel's Hobby plan runs cron jobs once a day, which is useless for booking
# that opens at an exact minute. GitHub Actions has minute granularity and is
# free for public repositories, so it drives the tick instead.
#
# This workflow is the safety net, not the timing mechanism: see watch.yml for
# that. GitHub's own caveat is that scheduled workflows are queued, not
# guaranteed punctual, and can be delayed by minutes under load — badly enough
# that a release can fall outside even this handler's claim window and be
# missed entirely rather than merely late. watch.yml exists precisely because
# that caveat makes this workflow alone unsuitable as the primary mechanism; it
# keeps running here only in case that job ever dies. When it does catch
# something, it claims a release from a minute either side of now and sleeps to
# the exact instant, logging its offset from T-0.
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch: {}

# A tick that overruns must not stack up behind the next one.
concurrency:
  group: booking-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fire the booking tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set"
            exit 1
          fi

          # --fail-with-body so a non-2xx fails the job *and* shows the reason.
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            --retry 2 --retry-delay 2 --retry-connrefused \
            -X POST "$APP_URL/api/cron/tick" \
            -H "Authorization: Bearer $CRON_SECRET"
