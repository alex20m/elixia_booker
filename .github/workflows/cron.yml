name: Booking cron

# Vercel's Hobby plan runs cron jobs once a day, which is useless for booking
# that opens at an exact minute. GitHub Actions has minute granularity and is
# free for public repositories, so it drives the tick instead.
#
# Note GitHub's own caveat: scheduled workflows are queued, not guaranteed
# punctual, and can be delayed by minutes under load. The handler is built for
# that — it claims a release from a minute either side of now and then sleeps to
# the exact instant, so a slightly late trigger still books on time. A very late
# one is logged with its offset from T-0 rather than silently missing.
on:
  schedule:
    - cron: '* * * * *'
  workflow_dispatch: {}

# A tick that overruns must not stack up behind the next one.
concurrency:
  group: booking-tick
  cancel-in-progress: false

jobs:
  tick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Fire the booking tick
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::error::APP_URL and CRON_SECRET repository secrets must be set"
            exit 1
          fi

          # --fail-with-body so a non-2xx fails the job *and* shows the reason.
          curl --fail-with-body --silent --show-error \
            --max-time 90 \
            --retry 2 --retry-delay 2 --retry-connrefused \
            -X POST "$APP_URL/api/cron/tick" \
            -H "Authorization: Bearer $CRON_SECRET"
